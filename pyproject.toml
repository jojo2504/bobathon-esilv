[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lightgbm==4.7.0",
    "optuna>=5.0.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "torch>=2.14.1",
    "xgboost==3.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
